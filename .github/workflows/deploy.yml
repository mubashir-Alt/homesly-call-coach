name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  backend:
    name: Backend (Supabase)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COACH_MODEL: ${{ vars.COACH_MODEL }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: cfg
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$PROJECT_REF" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Backend not deployed: add SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD (secrets) and SUPABASE_PROJECT_REF (variable). See SETUP.md."
          fi

      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ready == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.cfg.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Apply database changes
        if: steps.cfg.outputs.ready == 'true'
        run: supabase db push

      - name: Set AI secrets
        if: steps.cfg.outputs.ready == 'true'
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            supabase secrets set --project-ref "$PROJECT_REF" ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"
          else
            echo "::warning::ANTHROPIC_API_KEY secret is not set. The app will load but practice calls won't work."
          fi
          if [ -n "$COACH_MODEL" ]; then
            supabase secrets set --project-ref "$PROJECT_REF" COACH_MODEL="$COACH_MODEL"
          fi

      - name: Deploy function
        if: steps.cfg.outputs.ready == 'true'
        run: supabase functions deploy coach --project-ref "$PROJECT_REF"

  site:
    name: Website (GitHub Pages)
    runs-on: ubuntu-latest
    needs: backend
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p _site
          cp -r web/. _site/
          node -e 'const fs=require("fs");fs.writeFileSync("_site/config.js","window.HOMESLY_CONFIG = "+JSON.stringify({supabaseUrl:process.env.SUPABASE_URL||"",supabaseAnonKey:process.env.SUPABASE_ANON_KEY||""})+";\n")'
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
